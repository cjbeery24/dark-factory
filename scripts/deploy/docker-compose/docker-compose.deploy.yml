# Dark Factory — ephemeral deployment environment template.
#
# Usage:
#   export COMPOSE_PROJECT=df-${DF_SPEC_NAME}-${DF_RUN_ID}
#   docker compose -p $COMPOSE_PROJECT -f docker-compose.deploy.yml up -d
#
# Required env vars: APP_IMAGE, DB_PASSWORD (or use .env file)

services:
  app-stable:
    image: ${APP_IMAGE:-app:latest}
    ports:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD:-secret}@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-canary:
    image: ${APP_IMAGE_CANARY:-${APP_IMAGE:-app:latest}}
    ports:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://app:${DB_PASSWORD:-secret}@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "${EXPOSE_PORT:-8080}:80"
    volumes:
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-stable

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
      - POSTGRES_DB=app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
