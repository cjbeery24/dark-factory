# Postgres substrate-rules taxonomy.
#
# Conditional rules: each rule declares a *trigger* (regex patterns the
# spec validator scans for) and the *required substrate primitives* the
# spec author must declare in a `## Substrate Primitives` fenced TOML
# block when the trigger fires. The architect later transforms those
# primitives into a substrate manifest the gate's `verify_substrate()`
# phase executes against the live sidecar database.
#
# This file is the public contract surface for substrate verification.
# Schema changes (adding/removing fields on rules) are governed by
# `docs/ADAPTER-GOVERNANCE.md` and `docs/RELEASE-CADENCE.md`. Adding a
# new rule is a minor-version bump; removing or renaming an existing
# rule is a major-version bump with the standard deprecation window.
#
# Why TOML and not Python: keeping the taxonomy as data means new
# triggers are TOML edits reviewable in isolation. Python rules would
# entangle taxonomy changes with adapter logic changes, and would re-
# encode Postgres knowledge in the validator addendum (which must stay
# generic — see `spec_validator_addendum.md`).

schema_version = 1

[[rule]]
# B9e (2026-04-25, ROADMAP.md Phase 3): the `match_patterns` below
# hardcode the canonical Postgres community GUC namespace (`app.*`),
# while the rule's *purpose* (require structured `[[guc]]` primitive
# declarations whenever the spec depends on a custom GUC) is
# universal. Projects using non-canonical namespaces (`myapp.*`,
# `tenancy.*`) miss the trigger; defense-in-depth at scenario_lint
# and the mechanism-tokens blocklist still catches the foot-gun
# downstream. Classified UNIVERSAL with accepted false-negative —
# *not* a deferred CONVENTION migration. See `docs/audits/
# 2026-04-25-b9e-layering-audit.md` §2 for the rationale.
trigger = "custom_guc"
match_patterns = [
  "SET LOCAL app\\.[a-z_]+",
  "current_setting\\('app\\.",
]
required_primitives = ["name", "default"]
description = """
Spec asserts behavior depending on a custom Postgres GUC (e.g. \
`SET LOCAL app.tenant_id`). The spec author MUST declare each GUC in \
a `[[guc]]` table inside the `## Substrate Primitives` fenced block, \
naming the GUC `name` and `default` value so the architect can copy \
the entry verbatim into the substrate manifest and the gate can emit \
a `current_setting()` registration check.
"""

[[rule]]
trigger = "rls_policy"
match_patterns = [
  "ENABLE ROW LEVEL SECURITY",
  "CREATE POLICY",
]
required_primitives = ["name", "expected_policies"]
optional_primitives = ["force"]
description = """
Spec asserts row-level security policies. The spec author MUST declare \
each RLS-enabled table in a `[[rls_table]]` table inside the \
`## Substrate Primitives` fenced block, naming the table `name` and \
the `expected_policies` list of policy names attached to it, so the \
gate can verify `pg_tables.rowsecurity` and `pg_policies` rows exist. \
The author MAY also set `force = true` to require \
`FORCE ROW LEVEL SECURITY` on the table. This is the only way table \
owners (including the schema's creating role) are subject to RLS \
filtering — without it, an owner-role connection bypasses every \
policy, which is the scenario-layer footgun that produced the \
2026-04-22 NO-SHIP and motivated Task 43. When set, the architect \
emits `force_check` in the manifest and the gate verifies \
`pg_class.relforcerowsecurity` at `verify_substrate()` time.
"""

[[rule]]
trigger = "tenant_isolation"
match_patterns = [
  "tenant.*isolat",
  "multi[- ]tenant",
]
required_primitives = ["tenant_table"]
required_scenarios = [
  "positive_own_tenant_visible",
  "negative_other_tenant_invisible",
]
description = """
Spec asserts cross-tenant isolation. The spec author MUST declare each \
tenant-scoped table in a `[[tenant_isolation]]` table inside the \
`## Substrate Primitives` fenced block, naming the `tenant_table` \
field; the scenario architect must generate a positive (own rows \
visible) and negative (other-tenant rows invisible) pair against the \
live sidecar.
"""
