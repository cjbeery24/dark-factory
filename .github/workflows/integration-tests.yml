name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'darkfactory/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'darkfactory/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - name: Run integration tests (no Docker)
        run: python3 -m pytest tests/integration -v -m "not docker" --timeout=120

  docker-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - name: Build test Docker image
        run: docker build -t df-test-alpine -f tests/integration/Dockerfile.test .
      - name: Run Docker integration tests
        run: python3 -m pytest tests/integration -v -m "docker" --timeout=300
