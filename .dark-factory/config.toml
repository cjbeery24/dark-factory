# Dark Factory configuration
# Generated by `dark-factory init`

[core]
language = "python"
source_dirs = ["darkfactory"]
test_dir = "tests"
test_cmd = "pytest"

# Uncomment and configure when using Format A (*.scenarios.md) or
# Format B (*.journey.md) scenarios that require a running server.
#
# [test_server]
# # HTTP scenario runner (Format A)
# base_url = "http://localhost:8000"
# server_cmd = "uvicorn myapp:app --port 8000"
# startup_timeout = 30        # seconds to wait for /health to return 200
# health_path = "/health"     # path polled during startup; defaults to /health
#
# # Browser journey runner (Format B)
# browser_base_url = "http://localhost:3000"
# browser_server_cmd = "npm start"
# browser_startup_timeout = 60

