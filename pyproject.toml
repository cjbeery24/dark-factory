[project]
name = "dark-factory"
version = "1.0.0"
description = "Specification-driven AI development framework with information barriers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "tomli-w>=1.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0,<4.0",
]

[project.scripts]
dark-factory = "darkfactory.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "responses>=0.25",
    "freezegun>=1.4",
]

[tool.setuptools.packages.find]
include = ["darkfactory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests (deselect with -m 'not integration')",
    "docker: requires Docker daemon (deselect with -m 'not docker')",
    "slow: tests that take >30s",
]
