[project]
name = "dark-factory"
version = "1.0.0"
description = "Specification-driven AI development framework with information barriers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "tomli-w>=1.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0,<4.0",
]

[project.scripts]
dark-factory = "darkfactory.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "responses>=0.25",
    "freezegun>=1.4",
]
# A2: deterministic SQL syntax lint on fenced sql blocks in specs.
# Graceful no-op when not installed; enable with `pip install 'dark-factory[sql-lint]'`.
sql-lint = [
    "pglast>=7.0,<8.0",
]
# Sprint 30: maintained-SAST (Semgrep) security scan, compare-mode. Runs the
# vendored ruleset (darkfactory/review/sast_rules/) alongside the bespoke regex
# scanner to measure subsumption (the SAST-swap). Graceful no-op when not
# installed; enable with `pip install 'dark-factory[sast]'` + sast_compare_enabled.
# Pin range mirrors darkfactory/review/sast.py::_SEMGREP_MIN / _SEMGREP_MAX_MAJOR.
sast = [
    "semgrep>=1.166,<2.0",
]

[tool.setuptools.packages.find]
include = ["darkfactory*"]

# Data files that ship inside the wheel alongside the Python source.
# Without this, `[tool.setuptools.packages.find]` includes only `.py`
# files, and any non-editable install (`pip install dark-factory`)
# crashes on first load of a TOML / .md / .ts data file. Verified by
# `tests/unit/test_packaging_data_files.py` which pins the
# pyproject-side declaration against an explicit list of known data
# files.
#
# The contracts/ts/ subdir is included via the postgres key — its
# contents are data of the postgres package, even though contracts/
# is not itself a Python package (no __init__.py). Modern setuptools
# (>=62) handles this case.
[tool.setuptools.package-data]
"darkfactory.adapters.postgres" = [
    "*.toml",
    "*.md",
    "contracts/ts/*.ts",
    "contracts/ts/*.json",
    "contracts/ts/*.md",
    "setup/ts/*.ts",
    "setup/ts/*.sql",
]
"darkfactory.adapters.typescript" = ["*.md"]
"darkfactory.adapters.python_fastapi" = ["*.md"]
# Sprint 30: vendored, externally-maintained Semgrep ruleset
# (darkfactory/review/sast_rules/) for the compare-mode SAST scan. The YAML
# rule definitions, the version pin, the upstream LICENSE, and the README are
# read at runtime by darkfactory/review/sast.py; without this declaration a
# non-editable wheel install would have the dir missing and run_semgrep() would
# no-op (ran=False, "vendored ruleset dir missing"). sast_rules/ is data of the
# review package, not itself a Python package (no __init__.py).
"darkfactory.review" = [
    "sast_rules/RULESET_VERSION",
    "sast_rules/LICENSE",
    "sast_rules/README.md",
    "sast_rules/python/*.yaml",
    "sast_rules/node/*.yaml",
]
# ``darkfactory.contracts`` ships project-starter templates under
# ``templates/<adapter>/project-starters/`` (Phase 4 v0). These are
# read at runtime by ``dark-factory contracts init <adapter>``;
# without this declaration, non-editable wheel installs would have
# the directory missing and ``contracts init`` would fail with
# "unknown adapter" (the empty-list fallback in
# ``list_available_adapters``).
"darkfactory.contracts" = [
    "templates/**/*.ts",
    "templates/**/*.md",
    "templates/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = [
    "integration: integration tests (deselect with -m 'not integration')",
    "docker: requires Docker daemon (deselect with -m 'not docker')",
    "slow: tests that take >30s",
    "llm: invokes the Anthropic API via subprocess `claude -p` (Phase 3.5 reproducibility harness; opt-in via `-m llm`)",
]
filterwarnings = [
    # Surface DeprecationWarnings during test runs so callers still
    # importing the Sprint 1 A2 shim paths
    # (``darkfactory.spec.library_symbols``, ``...spec.stub_compile``,
    # ``...scenarios.proposal_rehearsal``) get visible signal in the
    # test summary. Default Python behavior silences DeprecationWarning
    # outside __main__; "default::" restores the print-once-per-location
    # default for everything in our test runs.
    "default::DeprecationWarning",
]
